name: Publish MkDocs Documentation
on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - name: Install Pixi
              uses: prefix-dev/setup-pixi@v0.8.1
              with:
                  pixi-version: v0.69.0
                  environments: docs
                  activate-environment: true

            # The main repo is private, so the website is published from a separate public repo
            # (bhklab/agentic-pharmacogx-docs). DOCS_DEPLOY_KEY = private half of a deploy key
            # whose public half is added (with write access) to that repo.
            - name: Build documentation
              run: mkdocs build -f mkdocs.yaml

            - name: Publish to the public docs repo
              uses: peaceiris/actions-gh-pages@v4
              with:
                  deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
                  external_repository: bhklab/agentic-pharmacogx-docs
                  publish_branch: gh-pages
                  publish_dir: ./site
